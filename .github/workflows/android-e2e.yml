name: android-e2e

# Tự kiểm app trên máy ảo Android: cài APK debug (bật gỡ lỗi WebView), mở bài từng thứ tiếng,
# kiểm phiên âm / bản dịch / ô tra từ, chụp màn hình. Kết quả: artifact "e2e-<số lần chạy>".
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'android/**'
      - 'tools/android_e2e.*'
      - '.github/workflows/android-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run vendor
      - run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK (WebView debugging on)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tools/android_e2e.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ github.run_number }}
          path: e2e/
          if-no-files-found: warn
